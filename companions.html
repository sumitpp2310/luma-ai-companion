<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma - Your Companions</title>
    <meta name="description" content="Discover and connect with your AI companions on Luma.">
    <meta name="author" content="Luma">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
    <link rel="shortcut icon" href="favicon.svg">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8B5CF6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Luma">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <!-- Open Graph -->
    <meta property="og:title" content="Luma - Your Companions">
    <meta property="og:description" content="Discover and connect with your AI companions.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://lumaai-companion.netlify.app/icons/icon-512.png">
    <meta property="og:site_name" content="Luma">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="companions.css">
</head>
<body>
    <nav class="companions-nav">
        <a class="nav-logo" href="companions.html">
            <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="16" r="16" fill="#8B5CF6"/>
                <path d="M12 10l8 6-8 6V10z" fill="white"/>
            </svg>
            <span>luma</span>
        </a>
        <div class="nav-right">
            <div class="nav-user">
                <div class="nav-avatar" id="navAvatar">U</div>
                <span id="userName">User</span>
            </div>
            <a class="nav-btn" href="chat.html">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                Chat
            </a>
            <button class="nav-signout" id="signOutBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Sign out
            </button>
        </div>
    </nav>

    <div class="companions-page">
        <div class="page-header">
            <h1>Your Companions</h1>
            <p>Choose who you want to chat with today.</p>
        </div>
        <div class="controls">
            <div class="search-bar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search companions...">
            </div>
            <div class="filter-pills">
                <button class="pill active" data-filter="all">All</button>
                <button class="pill" data-filter="witty">😂 Witty</button>
                <button class="pill" data-filter="energetic">⚡ Energetic</button>
                <button class="pill" data-filter="shy">😊 Shy</button>
                <button class="pill" data-filter="empathetic">❤️ Empathetic</button>
                <button class="pill" data-filter="philosophical">🌙 Philosophical</button>
                <button class="pill" data-filter="curious">🔍 Curious</button>
            </div>
        </div>
        <div class="companions-grid" id="companionsGrid"></div>
    </div>
    <script src="api.js"></script>
    <script>
        if (!API.isAuthenticated()) window.location.href = 'index.html';

        const currentUser = JSON.parse(localStorage.getItem('lumaCurrentUser') || '{}');
        const name = currentUser.name || 'User';
        const nameEl = document.getElementById('userName');
        const avatarEl = document.getElementById('navAvatar');
        if (nameEl) nameEl.textContent = name;
        if (avatarEl) avatarEl.textContent = name[0].toUpperCase();

        document.getElementById('signOutBtn').addEventListener('click', () => {
            API.clearSession();
            window.location.href = 'index.html';
        });

        let allCompanions = [];
        let activeFilter = 'all';

        async function loadCompanions() {
            try {
                allCompanions = await API.getCompanions();
                renderCompanions();
            } catch (err) {
                console.error('Failed to load companions:', err);
            }
        }

        function renderCompanions() {
            const grid = document.getElementById('companionsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';
            const filtered = allCompanions.filter(c => {
                const traits = c.personality.core || [];
                const matchesFilter = activeFilter === 'all' || traits.includes(activeFilter);
                const matchesSearch = c.name.toLowerCase().includes(search) || c.bio.toLowerCase().includes(search) || traits.some(t => t.includes(search));
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#565869;padding:40px;font-size:14px;">No companions found</div>';
                return;
            }

            filtered.forEach(c => {
                const traits = c.personality.core || [];
                const mood = c.current_mood || { display: '😊 feeling cheerful', emoji: '😊' };
                const card = document.createElement('div');
                card.className = 'companion-card';
                card.innerHTML = `
                    <button class="speak-btn" title="Hear voice">🔊</button>
                    <button class="card-chat-btn">Chat →</button>
                    <div class="card-avatar" style="background:${c.color}">${c.avatar_initial}</div>
                    <div class="card-identity">
                        <h3>${c.name}</h3>
                        <span>${c.age} years old · ${c.gender}</span>
                    </div>
                    <p class="card-bio">${c.bio}</p>
                    <div class="card-tags">${traits.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('')}</div>
                    <div class="card-status">
                        <span class="status-emoji">${mood.emoji || '😊'}</span>
                        <span class="status-text">${mood.display}</span>
                    </div>`;

                card.querySelector('.speak-btn').addEventListener('click', e => {
                    e.stopPropagation();
                    speakCompanion(c, `Hey! I'm ${c.name}, nice to meet you!`);
                });

                const startChat = () => {
                    localStorage.setItem('selectedCompanion', c.id);
                    window.location.href = 'chat.html';
                };

                card.querySelector('.card-chat-btn').addEventListener('click', e => {
                    e.stopPropagation();
                    startChat();
                });

                card.addEventListener('click', startChat);
                grid.appendChild(card);
            });
        }

        function speakCompanion(comp, text) {
            if (!window.speechSynthesis) return;
            speechSynthesis.cancel();
            const vc = comp.voice_config || {};
            const clean = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
            if (!clean) return;
            const u = new SpeechSynthesisUtterance(clean);
            u.pitch = vc.pitch || 1.0;
            u.rate = vc.rate || 1.0;
            speechSynthesis.speak(u);
        }

        document.querySelectorAll('.pill').forEach(pill => {
            pill.addEventListener('click', function() {
                document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                activeFilter = this.dataset.filter;
                renderCompanions();
            });
        });

        document.getElementById('searchInput').addEventListener('input', renderCompanions);
        if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => {};

        loadCompanions();
    </script>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}</script>
</body>
</html>
