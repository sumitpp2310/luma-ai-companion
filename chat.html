<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma - Chat</title>
    <meta name="description" content="Chat with your AI companion on Luma.">
    <meta name="author" content="Luma">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
    <link rel="shortcut icon" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8B5CF6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Luma">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="app-container">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-logo">
                    <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
                        <circle cx="16" cy="16" r="16" fill="#8B5CF6"/>
                        <path d="M12 10l8 6-8 6V10z" fill="white"/>
                    </svg>
                    <span>luma</span>
                </div>
                <button class="new-chat-btn" id="newChatBtn" title="New chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </div>

            <div class="sidebar-search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search chats...">
            </div>

            <div class="sidebar-section-label">Companions</div>
            <nav class="chat-list" id="chatList"></nav>

            <div class="sidebar-bottom">
                <button class="sidebar-bottom-btn" onclick="window.location.href='companions.html'">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>Companions</span>
                </button>
                <div class="sidebar-user" id="sidebarUser">
                    <div class="sidebar-user-avatar" id="sidebarUserAvatar">U</div>
                    <div class="sidebar-user-info">
                        <span class="sidebar-user-name" id="sidebarUserName">User</span>
                        <span class="sidebar-user-sub">Free plan</span>
                    </div>
                    <button class="signout-btn" id="signOutBtn" title="Sign out">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN CHAT -->
        <main class="chat-main">
            <!-- Header -->
            <header class="chat-header">
                <div class="chat-header-left">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                        </svg>
                    </button>
                    <div class="chat-header-companion">
                        <div class="header-avatar" id="headerAvatar">A</div>
                        <div>
                            <div class="header-name" id="companionName">Aria</div>
                            <div class="header-status">
                                <span class="status-dot-green"></span>
                                <span>Online</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="chat-header-right">
                    <button class="header-btn" id="clearChatBtn" title="Clear chat">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                            <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
                        </svg>
                    </button>
                    <button class="header-btn" id="togglePanelBtn" title="Companion info">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Messages -->
            <div class="chat-messages" id="chatMessages">
                <div class="chat-empty" id="chatEmpty">
                    <div class="chat-empty-avatar" id="chatEmptyAvatar">A</div>
                    <h2 id="chatEmptyName">Hey there!</h2>
                    <p id="chatEmptyBio">Start a conversation with your AI companion.</p>
                </div>
            </div>

            <!-- Input -->
            <div class="chat-input-area">
                <div class="chat-input-box">
                    <textarea id="chatInput" placeholder="Message your companion..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">Luma can remember your conversations and preferences.</p>
            </div>
        </main>

        <!-- RIGHT INFO PANEL -->
        <aside class="info-panel" id="infoPanel">
            <div class="info-panel-header">
                <h3>Profile</h3>
                <button class="close-panel-btn" id="closePanelBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="info-panel-body">
                <div class="profile-card">
                    <div class="profile-avatar-lg" id="profileAvatar">A</div>
                    <h2 class="profile-name" id="profileName">Aria</h2>
                    <span class="profile-age" id="profileAge">20 years old</span>
                    <span class="profile-mood-badge" id="profileMood">😌 feeling calm</span>
                </div>

                <div class="info-section">
                    <div class="info-section-title">Relationship</div>
                    <div class="rel-row">
                        <span class="rel-level" id="relLevel">Level 1</span>
                        <span class="rel-xp" id="relXp">0 XP</span>
                    </div>
                    <div class="rel-bar"><div class="rel-bar-fill" id="progressFill"></div></div>
                </div>

                <div class="info-section">
                    <div class="info-section-title">Traits</div>
                    <div class="traits-wrap" id="traitsContainer"></div>
                </div>

                <div class="info-section">
                    <div class="info-section-title">Memories <span class="mem-count" id="memCount">0</span></div>
                    <div class="memories-list" id="memoriesList">
                        <div class="mem-empty">No memories yet</div>
                    </div>
                </div>

                <div class="info-section">
                    <div class="info-section-title">Voice</div>
                    <div class="voice-grid">
                        <div class="voice-row">
                            <label>Style</label>
                            <select id="voiceStyle">
                                <option value="playful">Playful</option>
                                <option value="gentle">Gentle</option>
                                <option value="energetic">Energetic</option>
                                <option value="contemplative">Contemplative</option>
                                <option value="cute">Cute</option>
                                <option value="mysterious">Mysterious</option>
                                <option value="neutral" selected>Neutral</option>
                            </select>
                        </div>
                        <div class="voice-row">
                            <label>Pitch <span id="pitchVal">1.0</span></label>
                            <input type="range" id="voicePitch" min="0.5" max="2.0" step="0.05" value="1.0">
                        </div>
                        <div class="voice-row">
                            <label>Speed <span id="rateVal">1.0</span></label>
                            <input type="range" id="voiceRate" min="0.5" max="2.0" step="0.05" value="1.0">
                        </div>
                        <div class="voice-row">
                            <label>Volume <span id="volVal">1.0</span></label>
                            <input type="range" id="voiceVolume" min="0.1" max="1.0" step="0.05" value="1.0">
                        </div>
                    </div>
                    <div class="voice-btns">
                        <button class="voice-test-btn" id="testVoiceBtn">Test Voice</button>
                        <button class="voice-save-btn" id="saveVoiceBtn">Save</button>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="api.js"></script>
    <script src="chat.js"></script>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}</script>
</body>
</html>
